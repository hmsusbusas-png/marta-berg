<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marta Berg — Photographer in Saint Petersburg</title>
  <meta name="description" content="Marta Berg is a portrait, wedding and editorial photographer based in Saint Petersburg. Natural light, honest stories, timeless images.">
  <meta name="author" content="Marta Berg">
  <link rel="canonical" href="https://martaberg.com/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Marta Berg — Photographer in Saint Petersburg">
  <meta property="og:description" content="Portrait, wedding and editorial photography. Saint Petersburg.">
  <meta property="og:url" content="https://martaberg.com/">
  <meta property="og:image" content="https://picsum.photos/seed/marta-og/1200/630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="top">
  <nav class="nav container">
    <a class="nav__brand" href="#top">Marta Berg</a>
    <button class="nav__toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
    <ul class="nav__links" id="navLinks">
      <li><a href="#work">Work</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<main>

  <section class="hero">
    <img class="hero__img" src="https://picsum.photos/seed/marta-hero/1920/1280" alt="Misty morning on the Neva embankment, Saint Petersburg" fetchpriority="high">
    <div class="hero__overlay">
      <h1 class="hero__title">Marta<br><em>Berg</em></h1>
      <p class="hero__sub">Photographer — Saint&nbsp;Petersburg</p>
    </div>
    <a class="hero__scroll" href="#work" aria-label="Scroll to work">Scroll</a>
  </section>

  <section class="featured section" id="work">
    <div class="container">
      <h2 class="section__title reveal">Selected work</h2>
      <div class="featured__grid">
        <figure class="featured__item reveal">
          <img src="https://picsum.photos/seed/mb-feature-1/1000/1250" alt="Portrait of a dancer in a studio window light" loading="lazy">
          <figcaption>Anna, studio session</figcaption>
        </figure>
        <figure class="featured__item reveal">
          <img src="https://picsum.photos/seed/mb-feature-2/1000/700" alt="Bride and groom walking through an old courtyard" loading="lazy">
          <figcaption>Nadia &amp; Ilya, wedding</figcaption>
        </figure>
        <figure class="featured__item reveal">
          <img src="https://picsum.photos/seed/mb-feature-3/1000/1250" alt="Editorial fashion shoot on rooftops" loading="lazy">
          <figcaption>Roof series, editorial</figcaption>
        </figure>
      </div>
    </div>
  </section>

</main>

</body>
</html>
